name: APK Olusturucu

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Orijinal Android Debug Keystore Onbellegi
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: superbubble-android-debug-keystore-v2

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Proje Klasorlerini ve Manifesti Otomatik Hazirla
        run: |
          mkdir -p app/src/main/java/com/selim/superbubble
          mkdir -p app/src/test/java/com/selim/superbubble
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/xml

          for f in MainActivity BubbleService ChatSyncService NotificationParser ChatStorage ChatWindowView; do
            if [ -f "${f}.kt" ]; then
              cp "${f}.kt" "app/src/main/java/com/selim/superbubble/${f}.kt"
            elif [ -f "${f}.kt.txt" ]; then
              cp "${f}.kt.txt" "app/src/main/java/com/selim/superbubble/${f}.kt"
            fi
          done

          if [ -f "NotificationParserTest.kt" ]; then
            cp "NotificationParserTest.kt" "app/src/test/java/com/selim/superbubble/NotificationParserTest.kt"
          elif [ -f "NotificationParserTest.kt.txt" ]; then
            cp "NotificationParserTest.kt.txt" "app/src/test/java/com/selim/superbubble/NotificationParserTest.kt"
          fi

          python3 -c 'if True:
            manifest = """<?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
                <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                <uses-permission android:name="android.permission.READ_CONTACTS" />
                <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

                <queries>
                    <package android:name="com.whatsapp" />
                    <package android:name="com.whatsapp.w4b" />
                    <package android:name="com.instagram.android" />
                    <package android:name="org.telegram.messenger" />
                    <package android:name="org.telegram.messenger.web" />
                </queries>

                <application
                    android:allowBackup="false"
                    android:icon="@mipmap/ic_launcher"
                    android:roundIcon="@mipmap/ic_launcher"
                    android:label="SuperBubble Pro"
                    android:supportsRtl="true"
                    android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                    <activity
                        android:name=".MainActivity"
                        android:exported="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>

                    <service
                        android:name=".BubbleService"
                        android:exported="true"
                        android:configChanges="orientation|screenSize|keyboardHidden"
                        android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                        <intent-filter>
                            <action android:name="android.service.notification.NotificationListenerService" />
                        </intent-filter>
                    </service>

                    <service
                        android:name=".ChatSyncService"
                        android:exported="true"
                        android:label="SuperBubble Sohbet Eşitleyici"
                        android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                        <intent-filter>
                            <action android:name="android.accessibilityservice.AccessibilityService" />
                        </intent-filter>
                        <meta-data
                            android:name="android.accessibilityservice"
                            android:resource="@xml/accessibility_service_config" />
                    </service>
                </application>
            </manifest>"""
            open("app/src/main/AndroidManifest.xml", "w").write("\n".join(line.strip() for line in manifest.strip().splitlines()))

            acc_xml = """<?xml version="1.0" encoding="utf-8"?>
            <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
                android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
                android:accessibilityFeedbackType="feedbackGeneric"
                android:accessibilityFlags="flagReportViewIds"
                android:canRetrieveWindowContent="true"
                android:notificationTimeout="350"
                android:packageNames="com.whatsapp,com.whatsapp.w4b,com.instagram.android,org.telegram.messenger,org.telegram.messenger.web" />"""
            open("app/src/main/res/xml/accessibility_service_config.xml", "w").write("\n".join(line.strip() for line in acc_xml.strip().splitlines()))

            bg = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
                android:width="108dp"
                android:height="108dp"
                android:viewportWidth="108"
                android:viewportHeight="108">
                <path android:fillColor="#0F172A" android:pathData="M0,0h108v108h-108z"/>
                <path android:fillColor="#1E293B" android:pathData="M0,0L108,108L0,108z"/>
            </vector>"""
            open("app/src/main/res/drawable/ic_launcher_bg.xml", "w").write("\n".join(line.strip() for line in bg.strip().splitlines()))

            fg = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
                android:width="108dp"
                android:height="108dp"
                android:viewportWidth="108"
                android:viewportHeight="108">
                <path android:fillColor="#25D366" android:pathData="M42,30 C28,30 18,39 18,51 C18,57 21,62 26,66 L23,76 L34,71 C37,72 39,72 42,72 C56,72 66,63 66,51 C66,39 56,30 42,30 Z"/>
                <path android:fillColor="#0084FF" android:pathData="M64,40 C50,40 40,49 40,61 C40,73 50,82 64,82 C67,82 70,81 73,80 L84,85 L81,75 C86,71 88,66 88,61 C88,49 78,40 64,40 Z"/>
                <path android:fillColor="#FFFFFF" android:pathData="M52,56h24v4h-24zM52,64h16v4h-16z"/>
            </vector>"""
            open("app/src/main/res/drawable/ic_launcher_fg.xml", "w").write("\n".join(line.strip() for line in fg.strip().splitlines()))

            adaptive = """<?xml version="1.0" encoding="utf-8"?>
            <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                <background android:drawable="@drawable/ic_launcher_bg"/>
                <foreground android:drawable="@drawable/ic_launcher_fg"/>
            </adaptive-icon>"""
            open("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", "w").write("\n".join(line.strip() for line in adaptive.strip().splitlines()))

            gradle_props = """android.useAndroidX=true
            org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"""
            open("gradle.properties", "w").write("\n".join(line.strip() for line in gradle_props.strip().splitlines()))

            settings_gradle = """pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "SuperBubble"
            include ":app"
            """
            open("settings.gradle", "w").write("\n".join(line.strip() for line in settings_gradle.strip().splitlines()))

            root_gradle = """plugins {
                id "com.android.application" version "8.2.0" apply false
                id "org.jetbrains.kotlin.android" version "1.9.20" apply false
            }"""
            open("build.gradle", "w").write("\n".join(line.strip() for line in root_gradle.strip().splitlines()))

            app_gradle = """plugins {
                id "com.android.application"
                id "org.jetbrains.kotlin.android"
                id "kotlin-kapt"
            }

            android {
                namespace "com.selim.superbubble"
                compileSdk 34

                defaultConfig {
                    applicationId "com.selim.superbubble.pro"
                    minSdk 26
                    targetSdk 34
                    versionCode 5
                    versionName "5.0"
                }

                testOptions {
                    unitTests.returnDefaultValues = true
                }

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = "17"
                }
            }

            dependencies {
                implementation "androidx.core:core-ktx:1.12.0"
                implementation "androidx.appcompat:appcompat:1.6.1"
                implementation "com.google.android.material:material:1.11.0"
                implementation "androidx.recyclerview:recyclerview:1.3.2"
                implementation "androidx.room:room-runtime:2.6.1"
                implementation "androidx.room:room-ktx:2.6.1"
                kapt "androidx.room:room-compiler:2.6.1"
                testImplementation "junit:junit:4.13.2"
            }"""
            open("app/build.gradle", "w").write("\n".join(line.strip() for line in app_gradle.strip().splitlines()))
          '

      - name: Testleri Calistir ve APK Derle
        run: gradle testDebugUnitTest assembleDebug

      - name: APK Dosyasini Paketle
        uses: actions/upload-artifact@v4
        with:
          name: SuperBubble-APK
          path: app/build/outputs/apk/debug/app-debug.apk
